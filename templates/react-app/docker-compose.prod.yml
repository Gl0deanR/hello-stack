# Production stack. Differences from dev:
#   - no source volume mounts, no --reload
#   - frontend is built to static assets and served by nginx (which proxies /api)
#   - db port is NOT published to the host
#   - redis, pgadmin, and Celery are omitted
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    environment:
      TZ: Europe/Bucharest
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres:18+ stores data in a versioned subdir; mount at the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Europe/Bucharest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: /bin/sh -lc "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty base URL: the bundle calls /api/v1/... on the same origin,
        # and nginx proxies that prefix to the backend.
        VITE_API_URL: ""
        VITE_APP_NAME: ${APP_NAME}
    ports:
      - "${PROXY_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
